function exportPNG(){SH.forEach((t,i)=>{use(i);draw()});use(sel);const cs=SH.filter(t=>t.img&&t.W).map(t=>t.cv);if(!cs.length)return;const o=document.createElement('canvas');o.width=cs.reduce((a,c)=>a+c.width,0);o.height=Math.max(...cs.map(c=>c.height));const g=o.getContext('2d');let x=0;cs.forEach(c=>{g.drawImage(c,x,0);x+=c.width});o.toBlob(async bl=>{const f=new File([bl],($('#cn').value||'case')+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name=='AbortError')return}}dl(bl,f.name)})}
function newCase(){if(SH.some(t=>t.img)&&!confirm('Start a new case? Unsaved work will be lost.'))return;SH.forEach(t=>{t.S=mkS();t.img=null;t.imgURL='';t.hist=[];t.redo=[];t.arm=null;t.act=-1});Object.keys(AN).forEach(k=>delete AN[k]);AN.same=true;stage=1;maxS=1;$('#cn').value='Case-001';pick(sel)}
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadFile(f)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
resize();renderPanel();setPlane(0);
</script></body></html>
